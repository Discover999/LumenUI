name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Caches the Gradle user home and validates the wrapper for faster, reproducible runs.
      - uses: gradle/actions/setup-gradle@v6

      # Hosted runners are outside mainland China, where the aliyun mirrors can
      # answer 502 Bad Gateway. Anything in $GRADLE_USER_HOME/init.d/ is applied
      # automatically, so drop the aliyun repositories there instead of passing
      # -I on every gradlew call.
      - name: Skip aliyun mirrors in CI
        run: |
          mkdir -p "$GRADLE_USER_HOME/init.d"
          cp .github/ci-init.gradle "$GRADLE_USER_HOME/init.d/ci-init.gradle"

      - uses: android-actions/setup-android@v4

      - name: Install SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.1.0" "platform-tools"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Android Lint
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Build debug and release APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
