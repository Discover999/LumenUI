name: Release

# Tag-driven: push a vX.Y.Z tag (matching versionName in app/build.gradle.kts) and this
# builds a signed release APK and attaches it to a GitHub Release.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - uses: android-actions/setup-android@v4

      - name: Install SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.1.0" "platform-tools"

      # The keystore is base64-encoded in the RELEASE_KEYSTORE_BASE64 secret; write it
      # back to a file outside the checkout so it can never be staged by accident.
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$RELEASE_STORE_PASSWORD
          keyAlias=$RELEASE_KEY_ALIAS
          keyPassword=$RELEASE_KEY_PASSWORD
          EOF

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Android Lint
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Verify signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --print-certs "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true

      # Never leave signing material on the runner's disk after the job.
      - name: Remove signing material
        if: always()
        run: |
          rm -f keystore.properties "$RUNNER_TEMP/release.jks"
